name: PulseAlgo Daily Signal

on:
  schedule:
    - cron: '30 10 * * 1-5'  # 4PM IST = 10:30 UTC, Mon-Fri
  workflow_dispatch:          # manual trigger anytime

jobs:
  run-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal engine
        run: |
          cd src
          python signal_engine.py

      - name: Commit and push data
        run: |
          git config user.name "PulseAlgo Bot"
          git config user.email "bot@pulsealgo.com"
          git add data/
          git diff --staged --quiet || git commit -m "signal update $(date +'%Y-%m-%d')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}